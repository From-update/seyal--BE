services:
  postgres:
    image: postgres:16-alpine
    container_name: seyal_postgres
    restart: always
    environment:
      POSTGRES_DB: seyal_db
      POSTGRES_USER: seyal_user
      POSTGRES_PASSWORD: seyal_password_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seyal_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: seyal_api
    restart: always
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "prod-secret-seyal-2026-super-secure"
      DATABASE_URL: "postgresql://seyal_user:seyal_password_secure_2026@postgres:5432/seyal_db"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

volumes:
  postgres_data:
